services:
  yeet:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/data
    environment:
      # Compose reads these from deploy/.env; never commit that file.
      YEET_ORIGIN: ${YEET_ORIGIN:?Set YEET_ORIGIN in .env}
      # Optional legacy bootstrap. Fresh installs use the private setup link in logs.
      YEET_ADMIN_TOKEN: ${YEET_ADMIN_TOKEN:-}
      # Set to 1 only for local HTTP testing. Leave at 0 behind HTTPS.
      YEET_INSECURE_COOKIE: ${YEET_INSECURE_COOKIE:-0}
      # Set to 1 only if every request arrives through a trusted proxy/tunnel.
      YEET_TRUST_PROXY: ${YEET_TRUST_PROXY:-0}

  # Optional Cloudflare Tunnel connector. Enable with:
  #   docker compose --profile cloudflare up -d
  # Put the tunnel credentials JSON and a config.yml (see deploy/README.md) in
  # deploy/cloudflared/. Set CLOUDFLARED_UID in .env to the uid that owns them.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["cloudflare"]
    restart: unless-stopped
    user: "${CLOUDFLARED_UID:-65532}"
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - yeet
